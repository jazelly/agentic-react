# All tiers (validation / selective runs). High-tier installs are large — filter with --task/--tier.
name: cursor-full
description: every agentic-react Harbor task tier via Harbor (validate / selective runs)
root: ..
env_file: ~/.config/agentic-node/bench.env
secrets: [CURSOR_API_KEY]
agent:
  name: cursor-cli
  plugin:
    included_models: [composer-2.5, grok-4.7-low, grok-4.7-medium, grok-4.7-high, grok-4.7-xhigh]
    allow_non_included_models: false
models:
  - {id: composer-2.5, label: Composer 2.5}
  - {id: grok-4.7-high, label: Grok 4.7 High}
variants:
  control:
    description: stock React app
    dir: control
  agentic:
    description: agentic-react adapter overlay
    dir: agentic
baseline: control
tiers: [low, medium, high]
suites:
  - {id: agentic-react, backend: harbor}
trials: 3
concurrency: 1
network: open
budget:
  stop_on_billed_cost: true
  max_reported_cost_usd: 0
  max_estimated_cost_usd: 50
